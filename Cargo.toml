[workspace]
resolver = "2"
members = ["ogo-board", "ogo-sdk", "ogo-launcher", "ogo-recovery", "games/snake"]
# Own workspaces: they also build for the PC (xtask runs there, ogo-format is tested there)
exclude = ["xtask", "ogo-format"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ogo-board = { path = "ogo-board" }
ogo-sdk = { path = "ogo-sdk" }
ogo-format = { path = "ogo-format" }
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.53"
embuild = "0.33.5"
mipidsi = "0.10"
embedded-graphics = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
sha2 = "0.11"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

# Taken from the esp-rs esp-idf-template
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf.git" }
