[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# A host tool: not part of the firmware workspace, whose builds all target the ESP32.
[workspace]

[dependencies]
ogo-format = { path = "../ogo-format" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
