[build]
target = "xtensa-esp32-espidf"
# No target-dir here: on Windows, esp-idf-sys needs a short build folder, which depends on where the
# project is. See "Build folder" in the README.

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
# No runner on purpose: `cargo run` with espflash would flash espflash's default bootloader (no
# MENU for recovery) and could write over the recovery slot. Flash with `cargo xtask flash`.
# ldproxy always prints "Running ldproxy" to stderr, which newer rustc reports as a warning
rustflags = ["--cfg", "espidf_time64", "-A", "linker_messages"]

[alias]
# Build tasks (xtask/): cargo xtask pack | release | flash | test | samples. xtask runs on the PC.
xtask = "run --quiet --manifest-path xtask/Cargo.toml --target host-tuple --"

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.3"
# ESP-IDF 5.5 can't install its Python requirements on Python 3.15, and embuild always runs the
# `python` on PATH. With the Python install manager, this makes that `python` start 3.12.
PYTHON_MANAGER_DEFAULT = "3.12"
# Reuse the tools already installed in ~/.espressif instead of a per-project copy,
# which also keeps build paths shorter on Windows.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "sdkconfig.defaults", relative = true }
# Required by embuild when the target dir is moved
CARGO_WORKSPACE_DIR = { value = "", relative = true }
