# Adventure: little tile worlds to walk around in, made for children who can't read yet.
#
# Own workspace, like ogo-format and ogo-gb: these crates build and test on the PC (cargo xtask test).
[workspace]
resolver = "2"
members = ["format", "engine", "editor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
adventure-format = { path = "format" }
adventure-engine = { path = "engine" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", features = ["alloc"] }
