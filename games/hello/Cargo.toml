[package]
name = "hello"
version = "0.1.0"
authors = ["ogo examples"]
edition.workspace = true
rust-version.workspace = true
description = "Minimal test game: shows a screen and returns to the launcher on MENU"

# Read by `cargo xtask pack` for game.toml
[package.metadata.ogo]
name = "Hello"
sdk_version = 1

[[bin]]
name = "hello"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[dependencies]
ogo-board.workspace = true
anyhow.workspace = true
log.workspace = true
esp-idf-svc.workspace = true
embedded-graphics.workspace = true

[build-dependencies]
embuild.workspace = true
