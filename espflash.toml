# Read by cargo-espflash, which `cargo xtask flash` runs: the partition table to flash.
# cargo-espflash 4.3 ignores target_app_partition here, so xtask also passes --target-app-partition;
# the key stays so a plain `cargo espflash flash` would pick the launcher slot once it's honoured.
[idf]
partition_table = "partitions.csv"
target_app_partition = "launcher_a"
